<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Cairn. Stack small wins.">
  <defs>
    <clipPath id="card">
      <rect width="1280" height="400" rx="36" />
    </clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="#D7F55A" />
    <circle cx="1180" cy="-40" r="220" fill="#14151A" opacity="0.06" />
    <circle cx="1060" cy="460" r="180" fill="#14151A" opacity="0.05" />

    <g fill="#14151A">
      <ellipse cx="250" cy="300" rx="120" ry="44" transform="rotate(-3 250 300)" />
      <ellipse cx="244" cy="222" rx="88" ry="36" transform="rotate(5 244 222)" />
      <ellipse cx="258" cy="156" rx="58" ry="28" transform="rotate(-7 258 156)" />
      <ellipse cx="250" cy="102" rx="32" ry="19" transform="rotate(4 250 102)" />
    </g>

    <text x="440" y="200" fill="#14151A" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="132" font-weight="800" letter-spacing="-5">Cairn</text>
    <text x="446" y="258" fill="#14151A" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" opacity="0.85">Stack small wins. One stone a day.</text>

    <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
      <rect x="446" y="292" width="112" height="40" rx="20" fill="#14151A" />
