      <rect x="782" y="292" width="172" height="40" rx="20" fill="#14151A" />
      <text x="868" y="319" fill="#D7F55A" text-anchor="middle">Material 3</text>
      <rect x="966" y="292" width="140" height="40" rx="20" fill="#14151A" />
      <text x="1036" y="319" fill="#D7F55A" text-anchor="middle">Offline</text>
    </g>
